name: ACCP Web checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python evaluation/independent_evaluation.py --output quality/ci-evaluation.json
      - run: docker build -t accp-demo .
      - run: docker run --rm --entrypoint python accp-demo -c "from web_app import create_app; assert create_app()"
